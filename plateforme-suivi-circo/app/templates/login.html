{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}
{% block classe_contenu %}contenu--centre{% endblock %}
{% block contenu %}
<div class="carte carte--login">
  <h1>◆ {{ params.get('circonscription') or 'Suivi de circonscription' }}</h1>
  <p class="discret">Plateforme de suivi des enseignants et des élèves</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="champ">
      <label for="login">Identifiant</label>
      <input type="text" id="login" name="login" autocomplete="username" autofocus required>
    </div>
    <div class="champ">
      <label for="mot_de_passe">Mot de passe</label>
      <input type="password" id="mot_de_passe" name="mot_de_passe" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn--primaire btn--bloc">Se connecter</button>
  </form>
</div>
{% endblock %}
